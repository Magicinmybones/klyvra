<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLYVRA — Every Keystroke Made Remarkable</title>
<meta name="description" content="A thoughtfully engineered keyboard designed around the way you work, create, play, and move through your day.">
<meta name="theme-color" content="#e2e3e4">
<style>
/* ------------------------------------------------------------------
   Fonts (embedded, offline)
   Display: Archivo — static instance wght 900 / wdth 68, subset
   Body:    Figtree — variable wght 300–900, Basic Latin subset
------------------------------------------------------------------- */
@font-face{font-family:"Klyvra Display";src:url(asset/font-a06547a4633ee983.woff2) format("woff2");font-weight:900;font-style:normal;font-display:block}
@font-face{font-family:"Klyvra Text";src:url(asset/font-9f390bc7b65c3b7e.woff2) format("woff2");font-weight:300 900;font-style:normal;font-display:block}

/* ------------------------------------------------------------------
   Design tokens (all sampled from the 1467 × 1002 reference)
------------------------------------------------------------------- */
:root{
  --ink:#1d1d1e;            /* icons, menu                   */
  --logo:#1a1a1b;
  --nav:#252525;
  --chip-ink:#1c1d20;
  --headline:#1f1f21;       /* H1 fill                       */
  --body:#58585c;           /* subtitle                      */
  --accent:#fd4d1b;         /* CTA + keycaps                 */
  --accent-press:#e8400f;
  --surface:#fefefe;        /* "Contact Us" chip             */
  --bg-l:rgb(231.4,232.8,233.3);  /* gradient, left edge       */
  --bg-r:rgb(214.3,216.3,216.9);  /* gradient, right edge      */
  --dot:rgba(255,255,255,.22);    /* halftone dot texture (peak) */

  /* Reference artboard */
  --W:1467; --H:1002;
  /* 1 reference pixel, fitted to the viewport (contain, never crop) */
  --u:min(calc(100vw / var(--W)), calc(100vh / var(--H)));
}
@supports (height:100svh){ :root{ --u:min(calc(100vw / var(--W)), calc(100svh / var(--H))); } }

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg-l)}
body{
  font-family:"Klyvra Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block;overflow:visible}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ------------------------------------------------------------------
   Page shell: one full-bleed hero, exactly one viewport tall.
   Background bleeds edge-to-edge, so no bands appear at any size.
------------------------------------------------------------------- */
.page{
  position:relative;
  min-height:100vh;min-height:100svh;
  overflow:hidden;
  isolation:isolate;
  background:linear-gradient(90deg, var(--bg-l), var(--bg-r));
}
/* halftone dot texture — strength varies across the frame as in the photo
   (strong left edge, faint centre, medium right edge) */
.page::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, var(--dot) 0 calc(var(--u)*2.1), transparent calc(var(--u)*2.9)) calc(var(--u)*-2.6) calc(var(--u)*1.1) / calc(var(--u)*14.22) calc(var(--u)*14.22);
  -webkit-mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.62) 22%,rgba(0,0,0,.42) 50%,rgba(0,0,0,.5) 78%,rgba(0,0,0,.62) 100%);
          mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.62) 22%,rgba(0,0,0,.42) 50%,rgba(0,0,0,.5) 78%,rgba(0,0,0,.62) 100%);
}

/* ==================================================================
   STAGE MODE (landscape ≥ 900×600, aspect ≥ 6:5)
   Every element is placed in reference pixels × --u, so the layout is
   a 1:1 proportional replica of the artboard at any size.
   - The artboard is centred; spare width/height is filled by the
     full-bleed background, the nav pins to the viewport edges and the
     cable is extended to the right edge, so nothing ever looks empty.
=================================================================== */
.header{position:absolute;inset:0 0 auto 0;height:calc(var(--u)*86);z-index:5}
.logo{position:absolute;left:calc(var(--u)*84);top:calc(var(--u)*30);width:calc(var(--u)*148);height:calc(var(--u)*27);color:var(--logo)}
.logo svg{width:100%;height:100%}

.links{position:absolute;left:50%;top:0;height:100%;margin:0;padding:0;list-style:none}
.links a{
  position:absolute;white-space:nowrap;
  left:calc((var(--x) - 733.5) * var(--u));
  top:calc(var(--u)*33.6);
  font-size:calc(var(--u)*18.05);line-height:1;font-weight:330;letter-spacing:-.003em;
  color:var(--nav);
}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:calc(var(--u)*-6);height:calc(var(--u)*1.5);background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.links a:hover::after,.links a:focus-visible::after{transform:scaleX(1)}

.actions{position:absolute;right:calc(var(--u)*52);top:0;width:calc(var(--u)*300);height:100%}
.icon-btn{position:absolute;left:calc((var(--x) - 1115) * var(--u));top:calc(var(--y) * var(--u));width:calc(var(--s) * var(--u));height:calc(var(--s) * var(--u));color:var(--ink);transition:opacity .2s}
.icon-btn:hover{opacity:.65}
.icon-btn svg{width:100%;height:100%}
.menu-btn{display:none}

.contact{
  position:absolute;left:calc(var(--u)*105.5);top:calc(var(--u)*17);
  width:calc(var(--u)*194);height:calc(var(--u)*52.2);
  background:var(--surface);border-radius:calc(var(--u)*3.5);
  color:var(--chip-ink);transition:background-color .2s,box-shadow .2s;
}
.contact:hover{box-shadow:0 calc(var(--u)*6) calc(var(--u)*18) rgba(0,0,0,.08)}
.contact span{position:absolute;left:calc(var(--u)*24.2);top:calc(var(--u)*17.3);font-size:calc(var(--u)*19.6);line-height:1;white-space:nowrap;letter-spacing:.012em}
.contact svg{position:absolute;left:calc(var(--u)*147.4);top:calc(var(--u)*14.66);width:calc(var(--u)*25);height:calc(var(--u)*25)}

.stage{
  position:absolute;
  left:calc(50% - var(--u) * 733.5);
  top:calc(50% - var(--u) * 501);
  width:calc(var(--u) * 1467);height:calc(var(--u) * 1002);
}
.headline{
  position:absolute;left:0;right:0;top:calc(var(--u)*169.0);margin:0;
  font-family:"Klyvra Display",Impact,"Arial Narrow",sans-serif;font-weight:900;
  font-size:calc(var(--u)*102.82);line-height:calc(var(--u)*90);
  letter-spacing:-.0946em;word-spacing:.168em;
  text-align:center;text-transform:uppercase;color:var(--headline);
  padding-left:.0946em; /* cancel trailing tracking so the block centres optically */
  z-index:2;
}
.headline .l{display:block;white-space:nowrap;position:relative}
.headline i{font-style:normal;display:inline-block;margin-right:calc(var(--k,0) * var(--u));transform:scaleX(var(--sx,1));transform-origin:0 50%}
.headline i.sp{white-space:pre}
.headline .tsp{display:none} /* trailing word space only matters when the line re-flows */
.headline .l1{left:calc(var(--u)*-4.75)}
.headline .l2{left:calc(var(--u)*-2.75);letter-spacing:-.0664em}
.sub{
  position:absolute;left:0;right:0;top:calc(var(--u)*360.6);margin:0;
  font-size:calc(var(--u)*22.6);line-height:calc(var(--u)*27);font-weight:400;letter-spacing:-.008em;
  text-align:center;color:var(--body);z-index:2;
}
.sub .l{display:block;white-space:nowrap;position:relative;left:calc(var(--u)*2)}
.sub .l1{letter-spacing:.0051em}
.sub .l2{letter-spacing:-.0023em}
.cta{
  position:absolute;left:calc(var(--u)*612.5);top:calc(var(--u)*443.5);
  width:calc(var(--u)*247);height:calc(var(--u)*57);
  background:var(--accent);border-radius:calc(var(--u)*3.5);color:#fff;z-index:3;
  transition:background-color .2s,transform .2s;
}
.cta:hover{background:var(--accent-press)}
.cta:active{transform:translateY(1px)}
.cta span{position:absolute;left:calc(var(--u)*27.0);top:calc(var(--u)*19.1);font-size:calc(var(--u)*20.3);line-height:1;white-space:nowrap;letter-spacing:.022em}
.cta svg{position:absolute;left:calc(var(--u)*200.5);top:calc(var(--u)*17.5);width:calc(var(--u)*26);height:calc(var(--u)*26);color:#1a1513;transition:transform .25s ease}
.cta:hover svg{transform:translateX(calc(var(--u)*3))}

.product{
  position:absolute;left:calc(var(--u)*199.84);top:calc(var(--u)*379.85);
  width:calc(var(--u)*1267.07);aspect-ratio:2534 / 1246;margin:0;z-index:1;
}
/* contact shadow + bounce light sampled from the reference photograph,
   anchored in % of the product box so they travel with the keyboard */
.shade{position:absolute;z-index:-1;pointer-events:none;background:no-repeat 0 0 / 100% 100%}
.shade-d{left:-6.301%;top:19.606%;width:106.308%;height:94.218%;background-image:url(asset/image-f56bcee1d32657f7.png)}
.shade-l{left:-7.643%;top:19.446%;width:107.650%;height:76.242%;background-image:url(asset/image-0415728d21cacfa2.png)}
.product img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
/* cable continuation: last column of the cable, repeated to the viewport edge */
.cable{position:absolute;left:100%;top:0;width:100vw;height:11.236%;
  background:url(asset/image-027273e087a73487.png) repeat-x 0 0 / auto 100%;pointer-events:none}

/* ==================================================================
   FLOW MODE (portrait, tablets, phones, short landscape)
   The same markup re-flows into a centred column; type is fluid,
   the hero still fills exactly one viewport with no empty bands.
=================================================================== */
@media (max-width:899.98px),(max-height:599.98px),(max-aspect-ratio:6/5){
  :root{--g:clamp(16px,4.5vw,40px)}
  .page{
    display:flex;flex-direction:column;
  }
  .page::before{
    background:radial-gradient(circle at 50% 50%, var(--dot) 0 1.6px, transparent 2.3px) 0 0 / 11px 11px;
  }
  .header{position:relative;inset:auto;height:auto;display:flex;align-items:center;gap:clamp(12px,3vw,32px);padding:max(14px,env(safe-area-inset-top)) var(--g) 14px}
  .logo{position:static;flex:none;width:auto;height:clamp(19px,4.6vw,26px);aspect-ratio:148/27}
  .links{position:static;display:flex;gap:clamp(18px,3.4vw,40px);margin:0 auto;height:auto}
  .links a{position:relative;left:auto;top:auto;font-size:clamp(15px,2.1vw,17px)}
  .links a::after{bottom:-5px;height:1.5px}
  .actions{position:static;display:flex;align-items:center;gap:clamp(10px,2.4vw,22px);width:auto;height:auto;margin-left:auto}
  .icon-btn{position:relative;left:auto;top:auto;width:26px;height:26px;flex:none}
  .contact{position:relative;left:auto;top:auto;display:inline-flex;align-items:center;gap:12px;width:auto;height:44px;padding:0 14px 0 18px;border-radius:4px}
  .contact span{position:static;font-size:16px}
  .contact svg{position:static;width:22px;height:22px}
  .stage{position:relative;left:auto;top:auto;width:auto;height:auto;flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:clamp(12px,3vh,48px) 0 clamp(28px,6vh,72px)}
  /* free height is shared above the copy and above the product (no empty bands) */
  .headline{position:static;margin-top:auto;padding:0 var(--g);font-size:clamp(46px,12.4vw,104px);line-height:.875;letter-spacing:-.07em;word-spacing:.14em;text-wrap:balance}
  .headline .l{display:inline;white-space:normal;left:auto}
  .headline i,.headline i.sp{display:inline;margin:0;transform:none;white-space:normal}
  .sub{position:static;padding:0 var(--g);margin-top:clamp(14px,2.4vw,22px);max-width:40em;font-size:clamp(16px,2.6vw,21px);line-height:1.36;text-wrap:balance}
  .sub .l{display:inline;white-space:normal}
  .cta{position:relative;left:auto;top:auto;display:inline-flex;align-items:center;justify-content:space-between;gap:22px;width:auto;height:52px;padding:0 18px 0 24px;margin-top:clamp(20px,3.2vw,30px);border-radius:4px}
  .cta span{position:static;font-size:18px}
  .cta svg{position:static;width:24px;height:24px}
  .cta:hover svg{transform:translateX(3px)}
  /* keyboard body (asset x 16→2087) spans the column with --g gutters;
     the cable runs off the right edge naturally */
  .product{position:relative;left:auto;top:auto;align-self:flex-start;
    --kb:min(100vw - 2 * var(--g), 1100px);
    width:calc(var(--kb) * 2534 / 2071);
    margin-left:calc((100vw - var(--kb)) / 2 - var(--kb) * 16 / 2071);
    margin-top:auto;padding-top:clamp(20px,4vh,48px)}
  .menu-btn{display:none}
}
@media (max-width:759.98px){
  .links{display:none}
  .contact span{display:none}
  .contact{width:44px;padding:0;justify-content:center}
  .menu-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-10px;position:relative}
  .menu-btn i,.menu-btn i::before,.menu-btn i::after{display:block;width:20px;height:1.8px;background:var(--ink);border-radius:2px;transition:transform .25s,opacity .2s;content:""}
  .menu-btn i{position:relative}
  .menu-btn i::before{position:absolute;top:-6px}
  .menu-btn i::after{position:absolute;top:6px}
  .header[data-open] .menu-btn i{background:transparent}
  .header[data-open] .menu-btn i::before{transform:translateY(6px) rotate(45deg)}
  .header[data-open] .menu-btn i::after{transform:translateY(-6px) rotate(-45deg)}
  .header[data-open] .links{display:flex;position:absolute;top:100%;left:var(--g);right:var(--g);flex-direction:column;gap:0;margin:0;padding:6px 0;background:var(--surface);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.12);z-index:10}
  .header[data-open] .links a{display:block;padding:14px 20px;font-size:17px}
  .header[data-open] .links a::after{display:none}
}
/* Short landscape (phones on their side): two columns so the hero fits one screen */
@media (orientation:landscape) and (max-height:599.98px) and (min-width:560px){
  .header{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:6px;padding-left:max(var(--g),env(safe-area-inset-left));padding-right:max(var(--g),env(safe-area-inset-right))}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:1fr auto auto auto 1fr;column-gap:clamp(16px,3vw,48px);justify-items:start;padding:4px max(var(--g),env(safe-area-inset-right)) 12px max(var(--g),env(safe-area-inset-left))}
  .headline{grid-area:2/1;margin:0;padding:0;text-align:left;font-size:clamp(30px,min(11vh,6vw),72px)}
  .sub{grid-area:3/1;margin-top:clamp(8px,2.5vh,16px);padding:0;text-align:left;font-size:clamp(13px,3.6vh,17px);text-wrap:pretty}
  .cta{grid-area:4/1;margin-top:clamp(12px,4vh,24px);height:clamp(40px,11vh,52px)}
  .product{grid-area:1/2/6/3;align-self:center;width:122.36%;margin:0 0 0 -.77%;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

          <circle cx="1133.75" cy="43.6" r="8.85"/><path d="M1140.15 50 1145.6 55.45"/>

      <a class="icon-btn" href="#cart" aria-label="Cart" style="--x:1168;--y:31;--s:28">
        <svg viewBox="1168 31 28 28" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1173.3" y="39.5" width="17.6" height="16.3" rx="3.5"/><path d="M1178.3 42.3V37.6A3.3 3.3 0 0 1 1184.9 37.6V42.3"/>
        </svg>
      </a>
      <a class="contact" href="#contact">
        <span>Contact Us</span>
        <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false" fill="currentColor"><path d="M222.37 158.46l-47.11-21.11-.13-.06a16 16 0 0 0-15.17 1.4 8.12 8.12 0 0 0-.75.56L134.87 160c-15.42-7.49-31.34-23.29-38.83-38.51l20.78-24.71c.2-.25.39-.5.57-.77a16 16 0 0 0 1.32-15.06l0-.12L97.54 33.64a16 16 0 0 0-16.62-9.52A56.26 56.26 0 0 0 32 80c0 79.4 64.6 144 144 144a56.26 56.26 0 0 0 55.88-48.92 16 16 0 0 0-9.51-16.62ZM176 208A128.14 128.14 0 0 1 48 80 40.2 40.2 0 0 1 82.87 40a.61.61 0 0 0 0 .12l21 47L83.2 111.86a6.13 6.13 0 0 0-.57.77 16 16 0 0 0-1 15.7c9.06 18.53 27.73 37.06 46.46 46.11a16 16 0 0 0 15.75-1.14 8.44 8.44 0 0 0 .74-.56L168.89 152l47 21.05h0s.08 0 .11 0A40.21 40.21 0 0 1 176 208Z"/></svg>
      </a>
      <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false"><i></i></button>

  </header>

  <main class="stage">
    <h1 class="headline" aria-label="Every keystroke made remarkable."><span class="l l1" aria-hidden="true"><i style="--k:-4.5;--sx:0.79">E</i><i style="--k:2.5;--sx:0.96">v</i><i style="--k:-5.5;--sx:0.79">e</i><i style="--k:1;--sx:0.98">r</i><i style="--k:-1;--sx:1.02">y</i><i class="sp"> </i><i style="--k:4;--sx:0.98">k</i><i style="--k:-6;--sx:0.806">e</i><i style="--k:2.5;--sx:1.02">y</i><i style="--k:-12.5;--sx:0.806">s</i><i style="--sx:1.034">t</i><i style="--k:3;--sx:0.978">r</i><i style="--k:16;--sx:1.204">o</i><i style="--k:1.5;--sx:0.94">k</i><i style="--k:-15.5;--sx:0.756">e</i><i class="sp"> </i><i style="--k:11.5;--sx:1.102">m</i><i style="--k:-1;--sx:0.921">a</i><i style="--k:9.5;--sx:1.081">d</i><i style="--sx:0.773">e</i><i class="sp tsp"> </i></span><span class="l l2" aria-hidden="true"><i style="--k:3">r</i><i style="--k:-9;--sx:0.79">e</i><i style="--k:11;--sx:1.14">m</i><i style="--k:1">a</i><i style="--k:1.5">r</i><i style="--k:-0.5;--sx:0.96">k</i><i style="--sx:0.98">a</i><i style="--k:0.5;--sx:0.96">b</i><i style="--k:-9">l</i><i style="--k:-9;--sx:0.79">e</i><i style="--sx:1.298">.</i></span></h1>

    <a class="cta" href="#shop">
      <span>Shop Collection</span>
      <svg viewBox="813 459 26 26" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">

<script>
(function(){
  var h=document.querySelector('.header'),b=h.querySelector('.menu-btn');
  b.addEventListener('click',function(){
    var o=h.toggleAttribute('data-open');
    b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Close menu':'Open menu');
  });
  h.querySelectorAll('.links a').forEach(function(a){a.addEventListener('click',function(){h.removeAttribute('data-open');b.setAttribute('aria-expanded','false')})});
})();
</script>
</body>
</html>
